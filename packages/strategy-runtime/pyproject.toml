[project]
name = "finbar-strategy-runtime"
version = "0.3.0"
description = "Finbar strategy runtime — parser, evaluator, indicator calculator for strategy definitions"
requires-python = ">=3.12"
dependencies = [
    "pandas-ta>=0.3.14",
]

[project.optional-dependencies]
pandas = ["numpy>=1.26.0", "pandas>=2.0.0"]
yaml = ["pyyaml>=6.0.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "black>=24.0.0", "build>=1.2.0"]

[project.urls]
Repository = "https://github.com/..."

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"finbar_strategy_runtime.resources" = ["*.json"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# ruff's isort (I001) destructively splits aliased multi-line imports
# (from X import foo as bar) in this handler registry file. The imports are
# correctly sorted; suppress the false positive.
"**/price_action.py" = ["I001"]
# re-export after helper functions — deliberately not at top of file.
"**/_metric_registry.py" = ["E402"]
# Data file with long paper_reference strings and condition_notes.
"**/_metric_data.py" = ["E501"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
