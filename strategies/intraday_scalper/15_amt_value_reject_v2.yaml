# ⭐ AMT Value-Area Rejection V2 — improved risk management (PRODUCTION)
#
# Improvements over 14_amt_value_reject_30m_1h_mtf (based on causal trade analysis):
#
#   1. Tighter stop: 2.0× ATR (was 3.0×) — v1 long losers averaged $949 vs
#      $799 wins; tighter stop cuts the average loss while keeping wins.
#   2. Better R/R: 2.0 (was 1.5) — compensates for the tighter stop by
#      demanding more from winners, improving the win/loss ratio.
#
# Filters that were tested but REJECTED:
#   - stopping_volume entry filter: only True in 0.2% of bars (1/499) — too
#     rare to use as a hard entry filter. Better as a soft signal in Finbot.
#   - Trend-direction filter (poc_slope > 0 for longs): eliminated all trades.
#     VP rejections rarely coincide with trend-aligned POC slopes.
#   - balance_status filter: not compatible with incremental VP state (depends
#     on full-window recompute). Excluded until prefix-recompute metrics
#     support VP injection.
#
# Run with: enrichment_mode='live_parity_streaming' (default), 10% risk, 10x leverage

schema_version: "2.0"
name: amt_value_reject_v2
description: >
  Improved MTF AMT value-area rejection with tighter risk management.
  Same entry logic as v1 (VP rejection at session edges, 1h MTF filter)
  but with 2× ATR stop and 2:1 R/R to fix the win/loss ratio issue.
  30min entry filtered by 1h context. Long+short.

parameters:
  poc_slope_min:
    type: float
    default: -4.0
    minimum: -8.0
    maximum: 0.0
    description: Minimum POC slope (filters falling/rising knives)
  va_width_max:
    type: float
    default: 4.0
    minimum: 2.0
    maximum: 7.0
    description: Max value area width % (wider = more trades)
  atr_stop_mult:
    type: float
    default: 2.0
    minimum: 1.0
    maximum: 5.0
    description: ATR multiplier for stop (tighter than v1's 3.0 to cut avg loss)
  rr_ratio:
    type: float
    default: 2.0
    minimum: 1.0
    maximum: 3.0
    description: Risk/reward for take profit (higher than v1's 1.5 for better ratio)

timeframes:
  primary: 30min
  informative:
    - interval: 1h
      alias: h1

indicators:
  - {name: vp_poc, type: vp_poc, timeframe: primary}
  - {name: vp_vah, type: vp_vah, timeframe: primary}
  - {name: vp_val, type: vp_val, timeframe: primary}
  - {name: near_val, type: near_val, timeframe: primary}
  - {name: near_vah, type: near_vah, timeframe: primary}
  - {name: above_value, type: above_value, timeframe: primary}
  - {name: below_value, type: below_value, timeframe: primary}
  - {name: rejection_from_edge, type: rejection_from_edge, timeframe: primary}
  - {name: value_area_width_pct, type: value_area_width_pct, timeframe: primary}
  - {name: poc_slope_5, type: poc_slope_5, timeframe: primary}
  - {name: atr, type: atr, timeframe: primary}
  - {name: stopping_volume, type: stopping_volume, timeframe: primary}
  - {name: poc_slope_5_1h, type: poc_slope_5, timeframe: h1}
  - {name: above_value_1h, type: above_value, timeframe: h1}
  - {name: below_value_1h, type: below_value, timeframe: h1}

features: []

risk:
  stop_loss:
    type: atr
    multiplier: "{{ atr_stop_mult }}"
    indicator: atr
  take_profit:
    type: risk_reward
    ratio: "{{ rr_ratio }}"

sides:
  long:
    direction: long
    entry:
      condition:
        all:
          - {operator: is_true, left: near_val}
          - {operator: is_true, left: rejection_from_edge}
          - {operator: ">", left: poc_slope_5, right: "{{ poc_slope_min }}"}
          - {operator: "<", left: value_area_width_pct, right: "{{ va_width_max }}"}
          - {operator: ">", left: poc_slope_5_1h, right: -5.0}
          - {operator: is_false, left: above_value_1h}
    exit:
      condition:
        any:
          - {operator: is_true, left: above_value}
          - {operator: is_true, left: near_vah}
  short:
    direction: short
    entry:
      condition:
        all:
          - {operator: is_true, left: near_vah}
          - {operator: is_true, left: rejection_from_edge}
          - {operator: "<", left: poc_slope_5, right: 4.0}
          - {operator: "<", left: value_area_width_pct, right: "{{ va_width_max }}"}
          - {operator: "<", left: poc_slope_5_1h, right: 5.0}
          - {operator: is_false, left: below_value_1h}
    exit:
      condition:
        any:
          - {operator: is_true, left: below_value}
          - {operator: is_true, left: near_val}

metadata:
  category: scalper_amt_value_rejection
  primary_tf: 30min
  version: 2
  based_on: 14_amt_value_reject_30m_1h_mtf
  changes: >
    Tighter stop (2.0x ATR vs 3.0x) and higher R/R (2.0 vs 1.5) to fix
    the win/loss ratio < 1.0 issue from v1. Entry logic unchanged.
